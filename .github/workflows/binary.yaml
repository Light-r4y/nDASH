name: ndash-fw

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ndash-fw:
    strategy:
      fail-fast: false
      matrix:
        # The first two are tried on hardware; the other two only have to build.
        board: [ WAVESHARE_S3_LCD7, WAVESHARE_S3_LCD5, JC8048W550C, Sunton_S3_LCD7 ]
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0

    steps:
      - uses: actions/checkout@v4

      # The checkout is owned by another user inside the container; without this git refuses to
      # run and the commit in manifest.json would be "unknown".
      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # tools/build_release.py: builds into build_release/<board>/ with the release options and packs
      # release/v<version>/nDash-v<version>-<board>/ (+ .zip), the same as on a developer's machine.
      - name: Build and package ${{ matrix.board }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/build_release.py --board ${{ matrix.board }}

      - name: Looking at folder
        run: ls -lR release | head -80

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: "ndash_${{ matrix.board }}"
          path: "release/*/*.zip"
          if-no-files-found: error
